<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Nishat ♾️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 50% 30%, #35104d 0%, #16051f 35%, #050008 80%);
            color: white;
            font-family: Georgia, serif;
            overflow-x: hidden;
        }

        /* Stars */
        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite alternate;
        }

        @keyframes twinkle {
            from { opacity: .2; transform: scale(.7); }
            to   { opacity: 1; transform: scale(1.4); }
        }

        /* Main */
        .container {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .card {
            width: 100%;
            max-width: 650px;
            text-align: center;
            padding: 45px 25px;
            border: 1px solid rgba(255,255,255,.15);
            border-radius: 30px;
            background: rgba(255,255,255,.05);
            backdrop-filter: blur(12px);
            box-shadow: 0 0 50px rgba(190, 70, 255, .18);
        }

        .small {
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: .7;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(42px, 12vw, 80px);
            margin-bottom: 10px;
            background: linear-gradient(90deg, #fff, #ff9ed8, #fff);
            background-size: 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200%; }
        }

        .infinity {
            font-size: 90px;
            line-height: 1;
            margin: 15px 0;
            animation: float 3s ease-in-out infinite;
            text-shadow: 0 0 30px #ff65c7;
        }

        @keyframes float {
            50% { transform: translateY(-12px); }
        }

        .message {
            font-size: 19px;
            line-height: 1.9;
            color: #eee;
            margin: 25px auto;
            max-width: 520px;
        }

        .highlight {
            color: #ff9ed8;
        }

        button {
            margin-top: 25px;
            padding: 15px 28px;
            border: 1px solid rgba(255,255,255,.3);
            border-radius: 50px;
            background: rgba(255, 105, 190, .15);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: .3s;
        }

        button:hover {
            transform: scale(1.06);
            background: rgba(255, 105, 190, .3);
            box-shadow: 0 0 25px rgba(255,105,190,.4);
        }

        #secret {
            display: none;
            margin-top: 30px;
            animation: appear 1.5s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
